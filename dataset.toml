# Dataset manifest for hwe-bench/hwe-bench
# Add tasks using: harbor add <org>/<name>
# Publish using: harbor publish

[dataset]
name = "hwe-bench/hwe-bench"
description = "CAE-bench is SWE-bench for engineering simulation. It measures whether a model can do computer-aided engineering — FEA, CFD, multibody dynamics, durability and optimization — in real CAE software, scored by a deterministic verifier rather than an LLM judge. Tasks come from real engineering practice, not synthesized from papers. The current release covers CFD, combustion, battery and electronics-packaging thermal tasks."
keywords = [ "CAE", "combustion", "battery", "CFD", "packaging", "OpenFOAM", "Cantera", "PyBaMM", "CalculiX",]
[[dataset.authors]]
name = "SVD AI Lab"
email = "contact@svdailab.com"


